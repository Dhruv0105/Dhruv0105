name: Update Contributions

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get contribution count
        id: contrib
        uses: octokit/graphql-action@v2
        with:
          query: |
            query {
              user(login: "Dhruv0105") {
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                  }
                }
              }
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

          COUNT=$(echo '${{ steps.contrib.outputs.data }}' | jq '.user.contributionsCollection.contributionCalendar.totalContributions')

          perl -0777 -i -pe 's/<!-- CONTRIBUTIONS_START -->.*<!-- CONTRIBUTIONS_END -->/<!-- CONTRIBUTIONS_START -->'"$COUNT"'<!-- CONTRIBUTIONS_END -->/s' README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add README.md

          if ! git diff --cached --quiet; then
            git commit -m "Update contribution count"
            git push
          fi
