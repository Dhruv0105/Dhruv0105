name: Update Contributions

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Get Contributions
        run: |
          CONTRIBUTIONS=$(curl -s "https://github-contributions-api.deno.dev/Dhruv0105.json" | jq '.contributions')
          echo "CONTRIBUTIONS=$CONTRIBUTIONS" >> $GITHUB_ENV

      - name: Update README
        run: |
          sed -i "s/TOTAL_CONTRIBUTIONS:.*/TOTAL_CONTRIBUTIONS: $CONTRIBUTIONS/" README.md

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add README.md

          if ! git diff --staged --quiet; then
            git commit -m "Update contribution count"
            git push
          fi
